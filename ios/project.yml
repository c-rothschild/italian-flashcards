# Generate the Xcode project with:  cd ios && xcodegen
name: ItalianFlashcards
options:
  bundleIdPrefix: com.crothschild
  xcodeVersion: "27.1"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ItalianFlashcards:
    type: application
    platform: iOS
    sources:
      - path: ItalianFlashcards
      # Cards bundled into the app for the very first launch / offline use.
      - path: ../data/terms.csv
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crothschild.ItalianFlashcards
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Italiano
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3CNY6C5MX4 # your Apple ID team (set in Xcode › Signing & Capabilities)
  ItalianFlashcardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ItalianFlashcardsTests
    dependencies:
      - target: ItalianFlashcards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.crothschild.ItalianFlashcardsTests
  ItalianFlashcardsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ItalianFlashcardsUITests
    dependencies:
      - target: ItalianFlashcards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.crothschild.ItalianFlashcardsUITests
        TEST_TARGET_NAME: ItalianFlashcards
schemes:
  ItalianFlashcards:
    build:
      targets:
        ItalianFlashcards: all
        ItalianFlashcardsTests: [test]
        ItalianFlashcardsUITests: [test]
    test:
      targets:
        - ItalianFlashcardsTests
        - ItalianFlashcardsUITests
